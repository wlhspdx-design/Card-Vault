/* ─────────────────────────── chart ─────────────────────────── */
// Hand-drawn SVG line chart. `cost` draws the dashed what-you-paid line.

function Spark({ data, cost, color, height = 150 }) {
  if (!data || data.length < 2) return null;
  const W = 320, H = height, L = 46, R = 8, T = 12, B = 22;
  const stroke = color || "#4D9EFF";

  const vals = data.map((p) => p.v).concat(cost ? [cost] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi = hi === 0 ? 1 : hi * 1.15; lo = lo === 0 ? 0 : lo * 0.85; }
  const room = (hi - lo) * 0.12;
  lo = Math.max(0, lo - room); hi = hi + room;

  const px = (i) => L + (i / (data.length - 1)) * (W - L - R);
  const py = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = data.map((p, i) => `${px(i).toFixed(1)},${py(p.v).toFixed(1)}`).join(" ");

  const tick = (v) => (v >= 1000 ? "$" + Math.round(v / 100) / 10 + "k" : "$" + Math.round(v));
  const mid = (lo + hi) / 2;
  const gridStyle = { fontSize: 8, fill: "#7A8797", fontFamily: "ui-monospace, Menlo, monospace" };

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img">
      {[hi, mid, lo].map((v, i) => (
        <g key={i}>
          <line x1={L} y1={py(v)} x2={W - R} y2={py(v)} stroke="#242D3A" strokeWidth="1" />
          <text x={L - 5} y={py(v) + 3} textAnchor="end" style={gridStyle}>{tick(v)}</text>
        </g>
      ))}
      {cost > 0 && (
        <line x1={L} y1={py(cost)} x2={W - R} y2={py(cost)} stroke="#7A8797" strokeWidth="1" strokeDasharray="4 4" />
      )}
      <polyline points={line} fill="none" stroke={stroke} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((p, i) => (
        <circle key={i} cx={px(i)} cy={py(p.v)} r={i === data.length - 1 ? 3.2 : 2} fill={stroke} />
      ))}
      <text x={L} y={H - 6} style={gridStyle}>{data[0].d}</text>
      <text x={W - R} y={H - 6} textAnchor="end" style={gridStyle}>{data[data.length - 1].d}</text>
    </svg>
  );
}

async function shrink(file, maxW, quality) {
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Could not read that file."));
    r.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("That file isn't a readable image."));
    i.src = dataUrl;
  });
  const scale = Math.min(1, maxW / img.width);
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(img.width * scale));
  cv.height = Math.max(1, Math.round(img.height * scale));
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", quality);
}

/* ─────────────────────────── storage ─────────────────────────── */

// IndexedDB key/value store. Same shape as the artifact storage API, but it
// runs on your own domain and holds far more than localStorage would.
const DB_NAME = "cardvault";
const STORE = "kv";
let dbPromise = null;

function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}

function run(mode, fn) {
  return openDB().then(
    (db) =>
      new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, mode);
        const req = fn(tx.objectStore(STORE));
        tx.oncomplete = () => resolve(req ? req.result : undefined);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      })
  );
}

const storage = {
  async get(key) {
    const value = await run("readonly", (s) => s.get(key));
    if (value === undefined) throw new Error("Key not found: " + key);
    return { key, value };
  },
  async set(key, value) {
    await run("readwrite", (s) => s.put(value, key));
    return { key, value };
  },
  async delete(key) {
    await run("readwrite", (s) => s.delete(key));
    return { key, deleted: true };
  },
};

async function loadMeta() {

    const r = await storage.get(META);
    if (!r) return null;
    return JSON.parse(r.value);
  } catch {
    return null;
  }
}
async function saveMeta(data) {
  try {
    await storage.set(META, JSON.stringify(data));
    return true;
  } catch {
    return false;
  }
}
async function loadImg(id) {
  try {
    const r = await storage.get(imgKey(id));
    return r ? r.value : null;
  } catch {
    return null;
  }
}

const KEY_STORE = "cv:apikey";

async function loadApiKey() {
  try {

  } catch {

const saveApiKey = (k) => storage.set(KEY_STORE, k);

const ID_PROMPT = `You are looking at a photo of a collectible card. It may be a sports card or a trading card game card (Pokémon, One Piece, Magic, Yu-Gi-Oh!, Lorcana, Digimon and so on). Identify it and reply with ONLY a JSON object — no markdown fences, no explanation.

Keys: player, year, setName, cardNumber, sport, variant, parallelName, printRun, serial, rookie, firstEd, language, graded, gradeCompany, grade, cert

Rules:
- Use "" for anything you cannot actually read. Never guess.
- player: the athlete on a sports card, or the character/card name on a TCG card (e.g. "Monkey D. Luffy", "Charizard").
- sport: the category, one of: ${CATEGORIES.join(", ")}
- setName: the set or expansion (e.g. "Topps Chrome", "Romance Dawn OP-01", "Scarlet & Violet 151").
- cardNumber: as printed. Keep TCG formats intact like "OP01-025" or "199/165". No # sign.
- variant: the rarity or finish. For sports use one of: ${SPORT_VARIANTS.join(", ")}. For TCG use one of: ${TCG_VARIANTS.join(", ")}.
- parallelName: any extra variant wording, such as "alternate art" or "Gold Refractor".
- language: the language printed on the card — one of ${LANGUAGES.join(", ")}. Japanese cards have Japanese text; say so, it matters.
- rookie: true only if a sports card is marked RC or Rookie Card.
- firstEd: true only if a TCG card shows a 1st Edition stamp.
- If the card is sealed in a grading slab, read the label: graded=true, gradeCompany is PSA, BGS, SGC or CGC, grade is the number shown such as "10" or "9.5", cert is the certification number printed on the label.
- If it is a raw card, graded=false and leave gradeCompany, grade and cert empty.
- For a card stamped 23/99: serial="23" and printRun="99".`;

async function identifyCard(apiKey, dataUrl) {
  const m = /^data:(image\/[a-zA-Z]+);base64,(.+)$/.exec(dataUrl || "");
  if (!m) throw new Error("Couldn't read that photo.");

  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5",
        max_tokens: 600,
        messages: [
          {
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: m[1], data: m[2] } },
              { type: "text", text: ID_PROMPT },
            ],
          },
        ],
      }),
    });
  } catch {
    throw new Error("Couldn't reach the API. Check your connection.");
  }

  if (!res.ok) {
    if (res.status === 401) throw new Error("That API key was rejected. Check it in the Data tab.");
    if (res.status === 429) throw new Error("Too many requests — wait a moment, then try again.");
    if (res.status === 400) throw new Error("The API rejected that photo. Try a clearer one.");
    throw new Error(`Identify failed (error ${res.status}).`);
  }

  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if (start < 0 || end < 0) throw new Error("Couldn't make out the card in that photo.");
  try {
    return JSON.parse(text.slice(start, end + 1));
  } catch {
    throw new Error("Couldn't make out the card in that photo.");
  }
}

// "Beckett", "beckett bgs" etc. all mean BGS.
function normalizeGrader(raw) {
  const s = String(raw || "").toUpperCase();
  if (!s) return "";
  if (s.includes("BGS") || s.includes("BECKETT")) return "BGS";
  const hit = GRADERS.find((g) => g.code !== "Other" && s.includes(g.code));
  return hit ? hit.code : "";
}

function CertLookup({ company, cert }) {
  const [copied, setCopied] = useState(false);
  const cfg = CERT_LOOKUP[company];
  if (!cfg || !cert) return null;

  const onGo = () => {
    if (cfg.direct) return;
    navigator.clipboard?.writeText(cert)
      .then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); })
      .catch(() => {});
  };

  return (
    <div>
      <a href={cfg.url(cert)} target="_blank" rel="noopener noreferrer" onClick={onGo} className="contents">
        <Btn full>
          <Award size={13} />
          {cfg.direct ? `Open ${company} record` : copied ? "Cert copied — paste it" : `Look up on ${graderLabel(company)}`}
        </Btn>
      </a>
      {!cfg.direct && (
        <p style={{ fontSize: 10.5, color: C.muted, marginTop: 6, lineHeight: 1.45 }}>
          {graderLabel(company)} uses a search box instead of a direct link, so the number is copied for you.
        </p>
      )}

  );

/* ─────────────────────────── bulk import ─────────────────────────── */

function BulkImport({ onClose, onSaveAll }) {
  const [items, setItems] = useState([]);
  const [apiKey, setApiKey] = useState("");
  const [running, setRunning] = useState(false);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef(null);
  const cancelled = useRef(false);

  useEffect(() => { loadApiKey().then(setApiKey); }, []);
  useEffect(() => () => { cancelled.current = true; }, []);

  const pickFiles = async (e) => {
    const files = Array.from(e.target.files || []).filter((f) => f.type.startsWith("image/"));
    if (!files.length) return;
    setLoading(true);
    const next = [];
    for (const file of files.slice(0, 40)) {
      try {
        const [thumb, full] = await Promise.all([shrink(file, 300, 0.7), shrink(file, 1400, 0.8)]);
        next.push({ id: uid(), thumb, full, status: apiKey ? "queued" : "ready", data: null, error: "" });
      } catch {
        // skip anything that isn't a readable image
      }
    }
    setItems((p) => [...p, ...next]);
    setLoading(false);
    e.target.value = "";
  };

  // One at a time — kinder to the rate limit, and you can watch it work.
  const scanAll = async () => {
    if (!apiKey) return;
    setRunning(true);
    cancelled.current = false;
    const queue = items.filter((i) => i.status === "queued" || i.status === "error");
    for (const item of queue) {
      if (cancelled.current) break;
      setItems((p) => p.map((i) => (i.id === item.id ? { ...i, status: "scanning", error: "" } : i)));
      try {
        const data = await identifyCard(apiKey, item.full);
        setItems((p) => p.map((i) => (i.id === item.id ? { ...i, status: "ready", data } : i)));
      } catch (err) {
        setItems((p) => p.map((i) => (i.id === item.id ? { ...i, status: "error", error: err.message } : i)));
      }
    }
    setRunning(false);
  };

  const drop = (id) => setItems((p) => p.filter((i) => i.id !== id));

  const saveAll = () => {
    const usable = items.filter((i) => i.status === "ready" || i.status === "error");
    onSaveAll(usable.map((i) => ({ draft: buildCard(i.data), full: i.full, thumb: i.thumb })));
  };

  const readyCount = items.filter((i) => i.status === "ready" || i.status === "error").length;
  const pending = items.filter((i) => i.status === "queued" || i.status === "error").length;

  return (
    <Sheet title="Import photos" onClose={onClose}>
      <div className="space-y-4">
        <div className="rounded-lg p-3.5" style={{ background: C.case2, border: `1px solid ${C.rule}` }}>
          <Micro style={{ color: C.brass }}>Add many at once</Micro>
          <p style={{ fontSize: T.small, color: C.muted, marginTop: 8, lineHeight: 1.55 }}>
            {apiKey
              ? "Pick a batch of card photos and each one gets read and filled in. Review them, then save the lot."
              : "Pick a batch of card photos and they'll be added as blank cards. Save an API key in the Data tab and they'd be filled in for you."}
          </p>
        </div>

        <input ref={fileRef} type="file" accept="image/*" multiple onChange={pickFiles} className="hidden" />
        <Btn kind="solid" full onClick={() => fileRef.current?.click()} disabled={loading || running}>
          <Upload size={14} /> {loading ? "Loading photos…" : "Choose photos"}
        </Btn>

        {items.length > 0 && (
          <>
            <div className="flex gap-2">
              {apiKey && pending > 0 && (
                <Btn kind="solid" full onClick={scanAll} disabled={running}>
                  <Search size={14} /> {running ? "Reading…" : `Read ${pending}`}
                </Btn>
              )}
              <Btn full onClick={saveAll} disabled={running || !readyCount}>
                <Check size={14} /> Save {readyCount}
              </Btn>
            </div>

            <div className="space-y-2">
              {items.map((i) => {
                const d = i.data || {};
                const title = [d.year, d.setName, d.player].filter(Boolean).join(" ");
                return (
                  <div
                    key={i.id}
                    className="flex items-center gap-3 rounded-lg p-2.5"
                    style={{ background: C.case, border: `1px solid ${i.status === "error" ? C.loss : C.rule}` }}
                  >
                    <div
                      className="shrink-0 overflow-hidden"
                      style={{ width: 40, aspectRatio: "5/7", borderRadius: 5, border: `1px solid ${C.rule}` }}
                    >
                      <img src={i.thumb} alt="" className="h-full w-full object-cover" />
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="truncate" style={{ fontSize: T.body, color: C.text, fontWeight: 600 }}>
                        {title || (i.status === "scanning" ? "Reading…" : "Untitled card")}
                      </div>
                      <div style={{ fontSize: T.micro, color: i.status === "error" ? C.loss : C.muted, marginTop: 2 }}>
                        {i.status === "queued" && "Waiting"}
                        {i.status === "scanning" && "Reading the card…"}
                        {i.status === "ready" && (d.player ? "Filled in" : "Blank — edit after saving")}
                        {i.status === "error" && i.error}
                      </div>
                    </div>
                    <button onClick={() => drop(i.id)} className="shrink-0 p-1.5" style={{ color: C.muted }}>
                      <X size={16} />
                    </button>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </Sheet>
  );
}

// Turn whatever the scan returned into a real card.
function buildCard(r) {
  const c = blank();
  if (!r) return c;
  const put = (k, v) => { if (v !== undefined && v !== null && String(v).trim() !== "") c[k] = String(v).trim(); };
  put("player", r.player);
  put("year", r.year);
  put("setName", r.setName);
  put("cardNumber", String(r.cardNumber || "").replace(/^#/, ""));
  put("parallelName", r.parallelName);
  put("printRun", r.printRun);
  put("serial", r.serial);
  if (CATEGORIES.includes(r.sport)) c.sport = r.sport;
  if (variantsFor(c.sport).includes(r.variant)) c.variant = r.variant;
  else if (VARIANTS.includes(r.variant)) c.variant = r.variant;
  if (LANGUAGES.includes(r.language)) c.language = r.language;
  if (r.rookie === true) c.rookie = true;
  if (r.firstEd === true) c.firstEd = true;
  if (r.graded === true) {
    c.graded = true;
    const code = normalizeGrader(r.gradeCompany);
    if (code) c.gradeCompany = code;
    put("cert", r.cert);
    const scale = GRADE_SCALES[c.gradeCompany] || GRADE_SCALES.Other;
    const g = String(r.grade || "").trim();
    if (g) c.grade = scale.find((x) => x === g || x.split(" ")[0] === g) || g;
  }
  c.hasImage = true;
  return c;
}

/* ─────────────────────────── card form ─────────────────────────── */

const blank = () => ({
  id: uid(), createdAt: new Date().toISOString(), status: "owned",
  player: "", year: "", setName: "", cardNumber: "", sport: "Baseball",
  variant: "Base", parallelName: "", printRun: "", serial: "", rookie: false,
  firstEd: false, language: "English", collectionId: "",
  graded: false, gradeCompany: "PSA", grade: "", cert: "", condition: "Near Mint",
  qty: "1", purchasePrice: "", purchaseDate: "", value: "", valueUpdatedAt: "",
  salePrice: "", saleDate: "", notes: "", favorite: false, thumb: null, hasImage: false,
  history: [],
});

function CardForm({ initial, onSave, onClose, onDelete, collections = [] }) {
  const [f, setF] = useState(() => ({ ...blank(), ...(initial || {}) }));
  const [fullImg, setFullImg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [apiKey, setApiKey] = useState("");
  const [idState, setIdState] = useState("idle"); // idle | working | done | fail
  const fileRef = useRef(null);
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const toggle = (k) => () => setF((p) => ({ ...p, [k]: !p[k] }));

  useEffect(() => {
    if (initial?.hasImage && !fullImg) loadImg(initial.id).then((v) => v && setFullImg(v));
  }, [initial?.id]);

  useEffect(() => { loadApiKey().then(setApiKey); }, []);

  // Fill whatever the model could read; anything blank is left for you to type.
  const applyIdentified = (r) => {
    setF((p) => {
      const n = { ...p };
      const put = (k, v) => {
        if (v !== undefined && v !== null && String(v).trim() !== "") n[k] = String(v).trim();
      };
      put("player", r.player);
      put("year", r.year);
      put("setName", r.setName);
      put("cardNumber", String(r.cardNumber || "").replace(/^#/, ""));
      put("parallelName", r.parallelName);
      put("printRun", r.printRun);
      put("serial", r.serial);
      if (CATEGORIES.includes(r.sport)) n.sport = r.sport;
      if (variantsFor(n.sport).includes(r.variant)) n.variant = r.variant;
      else if (VARIANTS.includes(r.variant)) n.variant = r.variant;
      if (LANGUAGES.includes(r.language)) n.language = r.language;
      if (r.rookie === true) n.rookie = true;
      if (r.firstEd === true) n.firstEd = true;
      if (r.graded === true) {
        n.graded = true;
        const code = normalizeGrader(r.gradeCompany);
        if (code) n.gradeCompany = code;
        put("cert", r.cert);
        const scale = GRADE_SCALES[n.gradeCompany] || GRADE_SCALES.Other;
        const g = String(r.grade || "").trim();
        if (g) n.grade = scale.find((s) => s === g || s.split(" ")[0] === g) || g;
      }
      return n;
    });
  };

  const runIdentify = async (img) => {
    const photo = img || fullImg;
    if (!apiKey || !photo) return;
    setIdState("working");
    setErr("");
    try {
      applyIdentified(await identifyCard(apiKey, photo));
      setIdState("done");
    } catch (e) {
      setIdState("fail");
      setErr(e.message);
    }
  };

  const pick = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true); setErr(""); setIdState("idle");
    try {
      const [thumb, full] = await Promise.all([shrink(file, 300, 0.7), shrink(file, 1400, 0.8)]);
      setF((p) => ({ ...p, thumb, hasImage: true }));
      setFullImg(full);
      setBusy(false);
      if (apiKey) runIdentify(full);
      return;
    } catch (e2) {
      setErr(e2.message);
    }
    setBusy(false);
  };

  const save = () => {
    if (!f.player.trim() && !f.setName.trim()) {
      setErr("Add at least a player name or a set name so you can find this card later.");
      return;
    }
    onSave({ ...f, playerLower: f.player.toLowerCase() }, fullImg);
  };

  return (
    <Sheet title={initial ? "Edit card" : "Add card"} onClose={onClose}>
      <div className="space-y-4">
        {/* photo */}
        <div className="flex gap-3">
          <div
            className="relative shrink-0 overflow-hidden"
            style={{ width: 86, aspectRatio: "5/7", background: C.ink, border: `1px solid ${C.rule}`, borderRadius: 6 }}
          >
            {f.thumb || fullImg ? (
              <img src={fullImg || f.thumb} alt="" className="h-full w-full object-cover" />
            ) : (
              <div className="flex h-full items-center justify-center" style={{ color: C.rule }}>
                <ImageIcon size={18} />
              </div>
            )}
          </div>
          <div className="flex flex-1 flex-col justify-center gap-2">
            <input ref={fileRef} type="file" accept="image/*" onChange={pick} className="hidden" />
            <Btn onClick={() => fileRef.current?.click()} disabled={busy}>
              <Camera size={13} /> {busy ? "Working…" : f.hasImage ? "Replace photo" : "Add photo"}
            </Btn>
            {f.hasImage && (
              <Btn kind="ghost" onClick={() => { setF((p) => ({ ...p, thumb: null, hasImage: false })); setFullImg(null); setIdState("idle"); }}>
                <X size={13} /> Remove photo
              </Btn>
            )}
          </div>
        </div>

        {f.hasImage && apiKey && (
          <div
            className="flex items-center justify-between gap-2 rounded-md px-2.5 py-2"
            style={{
              background: C.case2,
              border: `1px solid ${idState === "fail" ? C.loss : idState === "done" ? C.brass : C.rule}`,
            }}
          >
            <span className="flex items-center gap-2">
              {idState === "working" && <Clock size={13} color={C.brass} />}
              {idState === "done" && <Check size={13} color={C.brass} />}
              {idState === "fail" && <AlertCircle size={13} color={C.loss} />}
              <span style={{ fontSize: 11.5, color: idState === "fail" ? C.loss : C.muted }}>
                {idState === "working" && "Reading the card…"}
                {idState === "done" && "Filled in — check it below"}
                {idState === "fail" && "Couldn't read it"}
                {idState === "idle" && "Ready to read this photo"}
              </span>
            </span>
            {idState !== "working" && (
              <button
                onClick={() => runIdentify()}
                className="shrink-0 uppercase"
                style={{ fontSize: 10, letterSpacing: "0.1em", fontWeight: 700, color: C.brass }}
              >
                {idState === "idle" ? "Read it" : "Again"}
              </button>
            )}
          </div>
        )}

        {err && (
          <div className="flex items-start gap-2 rounded-md p-2.5" style={{ background: "rgba(210,86,76,0.1)", border: `1px solid ${C.loss}` }}>
            <AlertCircle size={14} color={C.loss} className="mt-0.5 shrink-0" />
            <span style={{ fontSize: T.body, color: C.text }}>{err}</span>
          </div>
        )}

        <Field label="Player or subject"><In value={f.player} onChange={set("player")} placeholder="Shohei Ohtani" /></Field>

        <div className="grid grid-cols-3 gap-2">
          <Field label="Year"><In value={f.year} onChange={set("year")} placeholder="2024" inputMode="numeric" /></Field>
          <div className="col-span-2">
            <Field label="Set"><In value={f.setName} onChange={set("setName")} placeholder="Topps Chrome" /></Field>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <Field label="Card number" hint={isTCG(f.sport) ? "e.g. OP01-025" : ""}>
            <In value={f.cardNumber} onChange={set("cardNumber")} placeholder={isTCG(f.sport) ? "OP01-025" : "150"} />
          </Field>
          <Field label="Category">
            <Sel
              value={f.sport}
              onChange={(e) => {
                const cat = e.target.value;
                setF((p) => ({
                  ...p,
                  sport: cat,
                  variant: variantsFor(cat).includes(p.variant) ? p.variant : "Base",
                }));
              }}
            >
              {CATEGORIES.map((s) => <option key={s} value={s}>{s}</option>)}
              {f.sport && !CATEGORIES.includes(f.sport) && <option value={f.sport}>{f.sport}</option>}
            </Sel>
          </Field>
        </div>

        {collections.length > 0 && (
          <Field label="Collection">
            <Sel value={f.collectionId} onChange={set("collectionId")}>
              <option value="">Unsorted</option>
              {collections.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </Sel>
          </Field>
        )}

        {isTCG(f.sport) && (
          <Field label="Language" hint="changes the value a lot">
            <Sel value={f.language} onChange={set("language")}>
              {LANGUAGES.map((l) => <option key={l} value={l}>{l}</option>)}
            </Sel>
          </Field>
        )}

        <Field label={isTCG(f.sport) ? "Rarity / finish" : "Type"}>
          <Sel value={f.variant} onChange={set("variant")}>
            {variantsFor(f.sport).map((v) => <option key={v} value={v}>{v}</option>)}
            {f.variant && !variantsFor(f.sport).includes(f.variant) && <option value={f.variant}>{f.variant}</option>}
          </Sel>
        </Field>

        {f.variant !== "Base" && (
          <Field label={isTCG(f.sport) ? "Variant name" : "Parallel name"} hint="optional">
            <In
              value={f.parallelName}
              onChange={set("parallelName")}
              placeholder={isTCG(f.sport) ? "Charizard alt art" : "Gold Refractor"}
            />
          </Field>
        )}

        <div className="grid grid-cols-2 gap-2">
          <Field label="Serial" hint="the 23 in 23/99"><In value={f.serial} onChange={set("serial")} placeholder="23" inputMode="numeric" /></Field>
          <Field label="Print run" hint="the 99"><In value={f.printRun} onChange={set("printRun")} placeholder="99" inputMode="numeric" /></Field>
        </div>

        <div className="flex gap-2">
          {isTCG(f.sport) ? (
            <button
              onClick={toggle("firstEd")}
              className="flex-1 rounded-md px-3 py-2.5 uppercase"
              style={{
                fontSize: 10.5, letterSpacing: "0.12em", fontWeight: 700,
                border: `1px solid ${f.firstEd ? C.brass : C.rule}`,
                background: f.firstEd ? C.brass : "transparent",
                color: f.firstEd ? C.ink : C.muted,
              }}
            >
              1st Edition
            </button>
          ) : (
            <button
              onClick={toggle("rookie")}
              className="flex-1 rounded-md px-3 py-2.5 uppercase"
              style={{
                fontSize: 10.5, letterSpacing: "0.12em", fontWeight: 700,
                border: `1px solid ${f.rookie ? C.brass : C.rule}`,
                background: f.rookie ? C.brass : "transparent",
                color: f.rookie ? C.ink : C.muted,
              }}
            >
              Rookie card
            </button>
          )}
          <button
            onClick={toggle("favorite")}
            className="flex-1 rounded-md px-3 py-2.5 uppercase"
            style={{
              fontSize: 10.5, letterSpacing: "0.12em", fontWeight: 700,
              border: `1px solid ${f.favorite ? C.brass : C.rule}`,
              background: f.favorite ? C.brass : "transparent",
              color: f.favorite ? C.ink : C.muted,
            }}
          >
            Favorite
          </button>
        </div>

        {/* grading */}
        <div className="rounded-md p-3" style={{ background: C.case2, border: `1px solid ${C.rule}` }}>
          <button onClick={toggle("graded")} className="mb-2 flex w-full items-center justify-between">
            <span className="flex items-center gap-2">
              <Award size={14} color={f.graded ? C.brass : C.muted} />
              <Micro style={{ color: f.graded ? C.brass : C.muted, fontSize: 10.5 }}>Graded card</Micro>
            </span>
            <span
              className="rounded-full"
              style={{ width: 38, height: 21, background: f.graded ? C.brass : C.rule, position: "relative", transition: "background .15s" }}
            >
              <span
                className="absolute rounded-full"
                style={{ width: 17, height: 17, top: 2, left: f.graded ? 19 : 2, background: f.graded ? C.ink : C.muted, transition: "left .15s" }}
              />
            </span>
          </button>
          {f.graded && (
            <div className="space-y-3">
              <div>
                <div className="mb-1.5"><Micro>Grading company</Micro></div>
                <div className="flex flex-wrap gap-1.5">
                  {GRADERS.map((g) => (
                    <Chip
                      key={g.code}
                      active={f.gradeCompany === g.code}
                      onClick={() => setF((p) => ({ ...p, gradeCompany: g.code }))}
                    >
                      {g.label}
                    </Chip>
                  ))}
                </div>
              </div>

              <Field label="Grade" hint={`${f.gradeCompany || "PSA"} scale`}>
                <Sel value={f.grade} onChange={set("grade")}>
                  <option value="">Choose a grade</option>
                  {(GRADE_SCALES[f.gradeCompany] || GRADE_SCALES.Other).map((g) => (
                    <option key={g} value={g}>{g}</option>
                  ))}
                  {f.grade && !(GRADE_SCALES[f.gradeCompany] || GRADE_SCALES.Other).includes(f.grade) && (
                    <option value={f.grade}>{f.grade}</option>
                  )}
                </Sel>
              </Field>

              <Field label="Certification number" hint="on the slab label">
                <In value={f.cert} onChange={set("cert")} placeholder="86420135" />
              </Field>
              {(f.cert || "").trim() && <CertLookup company={f.gradeCompany} cert={(f.cert || "").trim()} />}
            </div>
          )}
          {!f.graded && (
            <Field label="Condition">
              <Sel value={f.condition} onChange={set("condition")}>
                {CONDITIONS.map((c) => <option key={c} value={c}>{c}</option>)}
              </Sel>
            </Field>
          )}
        </div>

        {/* money */}
        <div className="grid grid-cols-2 gap-2">
          <Field label="Paid"><In value={f.purchasePrice} onChange={set("purchasePrice")} placeholder="0.00" inputMode="decimal" /></Field>
          <Field label="Bought on"><In value={f.purchaseDate} onChange={set("purchaseDate")} type="date" /></Field>
        </div>

        <Field label="Value (USD)" hint="what it's worth today">
          <In value={f.value} onChange={set("value")} placeholder="0.00" inputMode="decimal" />
        </Field>

        <div className="grid grid-cols-2 gap-2">
          <Field label="Copies"><In value={f.qty} onChange={set("qty")} inputMode="numeric" /></Field>
          <Field label="Status">
            <Sel value={f.status} onChange={set("status")}>
              <option value="owned">In collection</option>
              <option value="sold">Sold</option>
            </Sel>
          </Field>
        </div>

        {f.status === "sold" && (
          <div className="grid grid-cols-2 gap-2">
            <Field label="Sold for"><In value={f.salePrice} onChange={set("salePrice")} placeholder="0.00" inputMode="decimal" /></Field>
            <Field label="Sold on"><In value={f.saleDate} onChange={set("saleDate")} type="date" /></Field>
          </div>
        )}

        <Field label="Notes">
          <textarea
            value={f.notes}
            onChange={set("notes")}
            rows={3}
            placeholder="Centering, where you bought it, comps you've seen…"
            style={{ ...inputStyle, resize: "vertical" }}
          />
        </Field>

        <div className="flex gap-2 pt-1">
          <Btn kind="solid" onClick={save} full><Check size={14} /> Save card</Btn>
          {initial && <Btn kind="danger" onClick={() => onDelete(initial.id)}><Trash2 size={14} /></Btn>}
        </div>
      </div>
    </Sheet>
  );
}

/* ─────────────────────────── detail ─────────────────────────── */

function CardDetail({ card, onClose, onEdit, onSetValue, collections }) {
  const [img, setImg] = useState(card.thumb);
  const [entry, setEntry] = useState("");
  const [copied, setCopied] = useState(false);
  const q = compQuery(card);

  useEffect(() => {
    if (card.hasImage) loadImg(card.id).then((v) => v && setImg(v));
  }, [card.id]);

  const value = num(card.value);
  const cost = num(card.purchasePrice);
  const qty = Math.max(1, num(card.qty) || 1);
  const delta = value - cost;
  const pct = cost ? (delta / cost) * 100 : null;

  const copy = () => {
    navigator.clipboard?.writeText(q).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1400);
    }).catch(() => {});
  };

  const commit = () => {
    if (!entry.trim()) return;
    onSetValue(card.id, num(entry));
    setEntry("");
  };

  // Price change starts at what you paid, then follows every value you've recorded.
  const series = useMemo(() => {
    const byDate = {};
    const buyDate = card.purchaseDate || (card.createdAt || "").slice(0, 10);
    if (cost && buyDate) byDate[buyDate] = cost;
    (card.history || []).forEach((h) => { if (h.d) byDate[h.d] = h.v; });
    if (!(card.history || []).length && value) byDate[card.valueUpdatedAt || todayISO()] = value;
    return Object.entries(byDate)
      .sort((a, b) => a[0].localeCompare(b[0]))
      .slice(-40)
      .map(([d, v]) => ({ d: d.slice(5), v }));
  }, [card]);

  return (
    <BottomSheet title={card.player || "Card"} onClose={onClose} action={<Btn onClick={onEdit}><Pencil size={13} /> Edit</Btn>}>
      <div className="space-y-4">
        <div className="flex gap-3">
          <div
            className="shrink-0 overflow-hidden"
            style={{ width: 128, aspectRatio: "5/7", background: C.ink, border: `1px solid ${C.rule}`, borderRadius: 6 }}
          >
            {img ? <img src={img} alt="" className="h-full w-full object-cover" />
                 : <div className="flex h-full items-center justify-center" style={{ color: C.rule }}><ImageIcon size={22} /></div>}
          </div>
          <div className="min-w-0 flex-1 space-y-2">
            <div>
              <Micro style={{ color: hueOf(card.sport) }}>{card.sport}</Micro>
              <div style={{ fontSize: 15, fontWeight: 700, color: C.text, lineHeight: 1.3 }}>{cardTitle(card)}</div>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {card.cardNumber && <Pill>#{String(card.cardNumber).replace(/^#/, "")}</Pill>}
              <Pill>{card.variant}</Pill>
              {card.parallelName && <Pill>{card.parallelName}</Pill>}
              {isNumbered(card) && (
                <Pill gold>{card.variant === "1-of-1" ? "1/1" : `${card.serial || "—"}/${card.printRun || "?"}`}</Pill>
              )}
              {card.rookie && <Pill gold>RC</Pill>}
              {card.firstEd && <Pill gold>1st Ed</Pill>}
              {card.language && card.language !== "English" && <Pill>{card.language}</Pill>}
              {card.graded
                ? <Pill tone={C.violet}>{card.gradeCompany} {gradeNum(card.grade)}{gradeTag(card.grade) ? " " + gradeTag(card.grade) : ""}</Pill>
                : <Pill>{card.condition}</Pill>}
              {qty > 1 && <Pill>×{qty}</Pill>}
              {card.status === "sold" && <Pill>Sold</Pill>}
              {(() => {
                const col = (collections || []).find((x) => x.id === card.collectionId);
                return col ? <Pill tone={col.color}>{col.name}</Pill> : null;
              })()}
            </div>
          </div>
        </div>

        {/* ledger */}
        <div className="grid grid-cols-3" style={{ background: C.case2, border: `1px solid ${C.rule}`, borderRadius: 8 }}>
          <Cell label="Value" value={value ? money(value) : "—"} color={C.brass} />
          <Cell label="Paid" value={cost ? money(cost) : "—"} border />
          <Cell
            label="Change"
            value={cost && value ? `${delta >= 0 ? "+" : ""}${money(delta)}` : "—"}
            sub={pct != null && value ? `${pct >= 0 ? "+" : ""}${pct.toFixed(0)}%` : null}
            color={cost && value ? (delta >= 0 ? C.gain : C.loss) : C.muted}
            border
          />
        </div>

        {/* comps */}
        <div className="rounded-md p-3" style={{ background: C.case2, border: `1px solid ${C.rule}` }}>
          <Micro style={{ color: C.brass }}>Check the market</Micro>
          <p style={{ fontSize: T.small, color: C.muted, margin: "6px 0 10px", lineHeight: 1.5 }}>
            Opens real sold listings for this exact card. Read the recent comps, then type the number below.
          </p>
          <div
            className="mb-2 truncate rounded px-2 py-1.5"
            style={{ background: C.ink, border: `1px solid ${C.rule}` }}
          >
            <Mono style={{ fontSize: 11, color: C.boneDim }}>{q || "—"}</Mono>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <a href={ebaySold(q)} target="_blank" rel="noopener noreferrer" className="contents">
              <Btn kind="solid" full><ExternalLink size={13} /> Sold comps</Btn>
            </a>
            <a href={ebayLive(q)} target="_blank" rel="noopener noreferrer" className="contents">
              <Btn full><Tag size={13} /> Live asks</Btn>
            </a>
          </div>
          <div className="mt-2 grid grid-cols-2 gap-2">
            <Btn onClick={copy}>{copied ? <Check size={13} /> : <Copy size={13} />} {copied ? "Copied" : "Copy search"}</Btn>
            <a href="https://130point.com/sales/" target="_blank" rel="noopener noreferrer" className="contents">
              <Btn full><ExternalLink size={13} /> 130point</Btn>
            </a>
          </div>
          <div className="mt-3 flex gap-2">
            <In value={entry} onChange={(e) => setEntry(e.target.value)} placeholder="New value" inputMode="decimal" />
            <Btn kind="solid" onClick={commit} disabled={!entry.trim()}><DollarSign size={13} /> Set</Btn>
          </div>
          {card.valueUpdatedAt && (
            <div className="mt-2 flex items-center gap-1.5">
              <Clock size={11} color={C.muted} />
              <span style={{ fontSize: 10.5, color: C.muted }}>Last valued {card.valueUpdatedAt}</span>
            </div>
          )}
        </div>

        {card.graded && (
          <div className="rounded-md p-3" style={{ background: C.case2, border: `1px solid ${C.rule}` }}>
            <Micro style={{ color: C.violet }}>Certification</Micro>
            <div className="mb-2.5 mt-2 space-y-1.5">
              <Row k="Company" v={graderLabel(card.gradeCompany)} />
              <Row k="Grade" v={card.grade || "—"} />
              <Row k="Cert number" v={card.cert || "—"} />
            </div>
            {(card.cert || "").trim()
              ? <CertLookup company={card.gradeCompany} cert={(card.cert || "").trim()} />
              : <p style={{ fontSize: T.small, color: C.muted, lineHeight: 1.45 }}>Add the cert number from the slab label to verify it here.</p>}
          </div>
        )}

        {series.length > 1 ? (
          <div className="rounded-md p-3" style={{ background: C.case2, border: `1px solid ${C.rule}` }}>
            <div className="flex items-baseline justify-between gap-2">
              <Micro>Price change</Micro>
              {cost > 0 && value > 0 && (
                <Mono style={{ fontSize: 10.5, color: delta >= 0 ? C.gain : C.loss }}>
                  {money(cost)} → {money(value)} ({pct >= 0 ? "+" : ""}{pct.toFixed(0)}%)
                </Mono>
              )}
            </div>
            <div style={{ marginTop: 10 }}>

/* ─────────────────────────── stats ─────────────────────────── */

function StatsView({ cards, snapshots, collections, onManage, onPick }) {
  const owned = cards.filter((c) => c.status !== "sold");
  const sold = cards.filter((c) => c.status === "sold");

  const qty = (c) => Math.max(1, num(c.qty) || 1);
  const totalValue = owned.reduce((s, c) => s + num(c.value) * qty(c), 0);
  const totalCost = owned.reduce((s, c) => s + num(c.purchasePrice) * qty(c), 0);
  const unreal = totalValue - totalCost;
  const realized = sold.reduce((s, c) => s + (num(c.salePrice) - num(c.purchasePrice)) * qty(c), 0);
  const count = owned.reduce((s, c) => s + qty(c), 0);
  const unvalued = owned.filter((c) => !num(c.value)).length;

  const bySport = useMemo(() => {
    const m = {};
    owned.forEach((c) => { m[c.sport] = (m[c.sport] || 0) + num(c.value) * qty(c); });
    return Object.entries(m).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  }, [cards]);

  const byType = useMemo(() => {
    const m = {};
    owned.forEach((c) => { m[c.variant] = (m[c.variant] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }, [cards]);

  const byGrader = useMemo(() => {
    const m = {};
    owned.filter((c) => c.graded).forEach((c) => {
      const k = c.gradeCompany || "Other";
      if (!m[k]) m[k] = { n: 0, v: 0 };
      m[k].n += qty(c);
      m[k].v += num(c.value) * qty(c);
    });
    return Object.entries(m).sort((a, b) => b[1].v - a[1].v);
  }, [cards]);

  const gradedCount = owned.filter((c) => c.graded).reduce((s, c) => s + qty(c), 0);

  const top = [...owned].sort((a, b) => num(b.value) - num(a.value)).slice(0, 8).filter((c) => num(c.value));
  const chart = (snapshots || []).slice(-60).map((s) => ({ d: s.d.slice(5), v: s.v }));
  const maxSport = bySport[0]?.[1] || 1;

  const byCollection = useMemo(() => {
    const rows = collections.map((col) => ({ ...col, n: 0, v: 0 }));
    const loose = { id: "", name: "Unsorted", color: C.muted, n: 0, v: 0 };
    owned.forEach((c) => {
      const row = rows.find((r) => r.id === c.collectionId) || loose;
      row.n += qty(c);
      row.v += num(c.value) * qty(c);
    });
    const all = [...rows, ...(loose.n ? [loose] : [])];
    return all.sort((a, b) => b.v - a.v);
  }, [cards, collections]);

  const topCollection = byCollection[0]?.v || 1;

  return (
    <div className="space-y-3 p-4">
      <div className="p-4" style={{ background: C.case, border: `1px solid ${C.rule}`, borderRadius: 12 }}>
        <Micro>Whole library</Micro>
        <Mono style={{ display: "block", fontSize: 30, fontWeight: 800, color: C.brass, marginTop: 6, lineHeight: 1 }}>
          {money(totalValue)}
        </Mono>
        <div className="mt-2 flex items-center gap-3">
          <Mono style={{ fontSize: T.small, color: C.muted }}>{count} cards</Mono>
          {totalCost > 0 && (
            <Mono style={{ fontSize: T.small, color: unreal >= 0 ? C.gain : C.loss }}>
              {unreal >= 0 ? "+" : ""}{money(unreal)} on {money(totalCost)}
            </Mono>
          )}
        </div>
      </div>

      <Panel title="By collection">
        {byCollection.length === 0 ? (
          <p style={{ fontSize: T.small, color: C.muted, lineHeight: 1.5 }}>
            Nothing here yet. Make a collection and assign cards to it.
          </p>
        ) : (
          <div className="space-y-3">
            {byCollection.map((r) => (
              <button key={r.id || "loose"} onClick={() => onPick(r.id)} className="block w-full text-left">
                <div className="mb-1.5 flex items-center gap-2">
                  <span style={{ width: 9, height: 9, borderRadius: 999, background: r.color, flexShrink: 0 }} />
                  <span className="min-w-0 flex-1 truncate" style={{ fontSize: T.body, color: C.text }}>{r.name}</span>
                  <Mono style={{ fontSize: T.micro, color: C.muted }}>{r.n}</Mono>
                  <Mono style={{ fontSize: T.small, color: r.color, minWidth: 62, textAlign: "right" }}>
                    {r.v ? money(r.v) : "—"}
                  </Mono>
                </div>
                <div style={{ height: 5, background: C.ink, borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ width: `${(r.v / topCollection) * 100}%`, height: "100%", background: r.color, borderRadius: 3 }} />
                </div>
              </button>
            ))}
          </div>
        )}
        <div className="mt-3">
          <Btn full onClick={onManage}><Layers size={13} /> Manage collections</Btn>
        </div>
      </Panel>

      <div className="grid grid-cols-2 gap-2">
        <Box label="Collection value" value={money(totalValue)} color={C.brass} big />
        <Box label="Cost basis" value={money(totalCost)} />
        <Box
          label="Unrealized"
          value={`${unreal >= 0 ? "+" : ""}${money(unreal)}`}
          color={unreal >= 0 ? C.gain : C.loss}
          icon={unreal >= 0 ? <TrendingUp size={12} /> : <TrendingDown size={12} />}
        />
        <Box
          label="Realized (sold)"
          value={`${realized >= 0 ? "+" : ""}${money(realized)}`}
          color={sold.length ? (realized >= 0 ? C.gain : C.loss) : C.muted}
        />
        <Box label="Cards held" value={String(count)} />
        <Box label="Needs a value" value={String(unvalued)} color={unvalued ? C.loss : C.muted} />
      </div>

      {chart.length > 1 && (
        <Panel title="Value over time">
          <div style={{ marginTop: 2 }}>
            <Spark data={chart} />
          </div>
        </Panel>
      )}

      {bySport.length > 0 && (
        <Panel title="Value by category">
          <div className="space-y-2">
            {bySport.map(([s, v]) => (
              <div key={s}>
                <div className="mb-1 flex items-baseline justify-between">
                  <span style={{ fontSize: T.body, color: C.text }}>{s}</span>
                  <Mono style={{ fontSize: 11.5, color: hueOf(s) }}>{money(v)}</Mono>
                </div>
                <div style={{ height: 5, background: C.ink, borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ width: `${(v / maxSport) * 100}%`, height: "100%", background: hueOf(s), borderRadius: 3 }} />
                </div>
              </div>
            ))}
          </div>
        </Panel>
      )}

      {byGrader.length > 0 && (
        <Panel title="Graded cards by company">
          <div className="space-y-2">
            {byGrader.map(([code, d]) => (
              <div key={code} className="flex items-center justify-between">
                <span className="flex items-center gap-2">
                  <Award size={13} color={C.brass} />
                  <span style={{ fontSize: T.body, color: C.text }}>{graderLabel(code)}</span>
                  <Mono style={{ fontSize: 10.5, color: C.muted }}>×{d.n}</Mono>
                </span>
                <Mono style={{ fontSize: 11.5, color: C.brass }}>{d.v ? money(d.v) : "—"}</Mono>
              </div>
            ))}
          </div>
          <div className="mt-2.5 pt-2.5" style={{ borderTop: `1px solid ${C.rule}` }}>
            <Row k="Graded / raw split" v={`${gradedCount} / ${Math.max(0, count - gradedCount)}`} />
          </div>
        </Panel>
      )}

      {top.length > 0 && (
        <Panel title="Most valuable">
          <div className="space-y-1.5">
            {top.map((c, i) => (
              <div key={c.id} className="flex items-center gap-2.5">
                <Mono style={{ fontSize: 10, color: C.muted, width: 16 }}>{String(i + 1).padStart(2, "0")}</Mono>
                <span className="min-w-0 flex-1 truncate" style={{ fontSize: T.body, color: C.text }}>
                  {cardTitle(c)}
                </span>
                <Mono style={{ fontSize: 11.5, color: C.brass }}>{money(num(c.value))}</Mono>
              </div>
            ))}
          </div>
        </Panel>
      )}

      {byType.length > 0 && (
        <Panel title="Cards by type">
          <div className="flex flex-wrap gap-1.5">
            {byType.map(([t, n]) => (
              <span
                key={t}
                className="rounded px-2 py-1"
                style={{ fontSize: 11, color: C.text, border: `1px solid ${C.rule}`, background: C.ink }}
              >
                {t} <Mono style={{ color: C.brass }}>{n}</Mono>
              </span>
            ))}
          </div>
        </Panel>
      )}
    </div>
  );
}

/* ─────────────────────────── values queue ─────────────────────────── */

function ValuesView({ cards, onSetValue }) {
  const [draft, setDraft] = useState({});
  const queue = useMemo(
    () =>
      cards
        .filter((c) => c.status !== "sold")
        .sort((a, b) => {
          const av = num(a.value) ? 1 : 0, bv = num(b.value) ? 1 : 0;
          if (av !== bv) return av - bv;
          return (a.valueUpdatedAt || "").localeCompare(b.valueUpdatedAt || "");
        }),
    [cards]
  );

  if (!queue.length) {
    return (
      <Empty
        icon={<DollarSign size={26} />}
        head="Nothing to value yet"
        body="Add a card and it shows up here, oldest value first."
      />
    );

  return (
    <div className="p-3">
      <div className="mb-3 rounded-md p-3" style={{ background: C.case, border: `1px solid ${C.rule}` }}>
        <Micro style={{ color: C.brass }}>Keep values current</Micro>
        <p style={{ fontSize: T.small, color: C.muted, marginTop: 6, lineHeight: 1.5 }}>
          Cards with no value come first, then whatever you checked longest ago. Tap the comps link, read the
          recent sales, type the number.
        </p>
      </div>
      <div className="space-y-2">
        {queue.map((c) => {
          const q = compQuery(c);
          return (
            <div key={c.id} className="p-2.5" style={{ background: C.case, border: `1px solid ${C.rule}`, borderRadius: 8 }}>
              <div className="flex items-start gap-2.5">
                <div className="shrink-0 overflow-hidden" style={{ width: 38, aspectRatio: "5/7", background: C.ink, borderRadius: 4, border: `1px solid ${C.rule}` }}>
                  {c.thumb && <img src={c.thumb} alt="" className="h-full w-full object-cover" />}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="truncate" style={{ fontSize: T.body, color: C.text, fontWeight: 600 }}>{cardTitle(c)}</div>
                  <div className="mt-0.5 flex items-center gap-1.5">
                    <Mono style={{ fontSize: 10.5, color: num(c.value) ? C.brass : C.loss }}>
                      {num(c.value) ? money(num(c.value)) : "no value"}
                    </Mono>
                    {c.valueUpdatedAt && <span style={{ fontSize: 10, color: C.muted }}>· {c.valueUpdatedAt}</span>}
                  </div>
                </div>
              </div>
              <div className="mt-2 flex gap-2">
                <a href={ebaySold(q)} target="_blank" rel="noopener noreferrer" className="contents">
                  <Btn><ExternalLink size={12} /> Comps</Btn>
                </a>
                <In
                  value={draft[c.id] ?? ""}
                  onChange={(e) => setDraft((p) => ({ ...p, [c.id]: e.target.value }))}
                  placeholder="Value"
                  inputMode="decimal"
                  style={{ padding: "8px 10px", fontSize: 13 }}
                />
                <Btn
                  kind="solid"
                  disabled={!String(draft[c.id] ?? "").trim()}
                  onClick={() => {
                    onSetValue(c.id, num(draft[c.id]));
                    setDraft((p) => ({ ...p, [c.id]: "" }));
                  }}
                >
                  <Check size={13} />
                </Btn>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─────────────────────────── data ─────────────────────────── */

function DataView({ cards, snapshots, onImport, onWipe }) {
  const [msg, setMsg] = useState("");
  const [keyDraft, setKeyDraft] = useState("");
  const [hasKey, setHasKey] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => { loadApiKey().then((k) => setHasKey(!!k)); }, []);

  const storeKey = async () => {
    const k = keyDraft.trim();
    if (!k) return;
    await saveApiKey(k);
    setHasKey(true);
    setKeyDraft("");
    setMsg("Key saved. Photos will fill the card in from now on.");
  };

  const dropKey = async () => {
    await clearApiKey();
    setHasKey(false);
    setMsg("Key removed. Photos won't be sent anywhere.");
  };

  const download = (name, text, type) => {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };

  const csv = () => {
    const cols = ["player","year","setName","cardNumber","sport","variant","parallelName","serial","printRun","rookie","firstEd","language","graded","gradeCompany","grade","cert","condition","qty","purchasePrice","purchaseDate","value","valueUpdatedAt","status","salePrice","saleDate","notes"];
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [cols.join(","), ...cards.map((c) => cols.map((k) => esc(c[k])).join(","))];
    download(`cards-${todayISO()}.csv`, rows.join("\n"), "text/csv");
    setMsg("Exported a CSV of every card.");
  };

  const json = () => {
    download(`card-vault-${todayISO()}.json`, JSON.stringify({ v: 2, cards, snapshots }, null, 2), "application/json");
    setMsg("Exported a full backup. Photos aren't included — keep the originals.");
  };

  const read = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data.cards)) throw new Error("no cards");
      onImport(data.cards, data.snapshots || []);
      setMsg(`Loaded ${data.cards.length} cards from that backup.`);
    } catch {
      setMsg("That file isn't a Card Vault backup. Pick the .json file you exported.");
    }
    e.target.value = "";
  };

  const bytes = new Blob([JSON.stringify({ cards, snapshots })]).size;

  return (
    <div className="space-y-3 p-4">
      <Panel title="Your data">
        <div className="space-y-1.5">
          <Row k="Cards" v={String(cards.length)} />
          <Row k="With photos" v={String(cards.filter((c) => c.hasImage).length)} />
          <Row k="Index size" v={`${(bytes / 1024).toFixed(0)} KB`} />
          <Row k="App version" v={BUILD} />
        </div>
        <p style={{ fontSize: T.small, color: C.muted, marginTop: 10, lineHeight: 1.5 }}>
          Everything saves automatically and stays here between visits. Export a backup now and then so you always
          hold your own copy.
        </p>
      </Panel>

      {msg && (
        <div className="rounded-md p-2.5" style={{ background: C.case2, border: `1px solid ${C.brass}` }}>
          <span style={{ fontSize: T.body, color: C.text }}>{msg}</span>
        </div>
      )}

      <Panel title="Photo auto-fill">
        <p style={{ fontSize: T.small, color: C.muted, lineHeight: 1.5 }}>
          With a key saved, taking a photo reads the card and fills in the player, year, set, number and
          parallel. On a slab it also reads the company, grade and cert number.
        </p>
        <div className="mt-2.5 mb-2 flex items-center gap-2">
          <span
            className="rounded-full"
            style={{ width: 7, height: 7, background: hasKey ? C.brass : C.rule, display: "inline-block" }}
          />
          <Micro style={{ color: hasKey ? C.brass : C.muted }}>{hasKey ? "Key saved" : "No key yet"}</Micro>
        </div>
        {hasKey ? (
          <Btn kind="danger" full onClick={dropKey}><X size={13} /> Remove key</Btn>
        ) : (
          <div className="space-y-2">
            <In
              type="password"
              value={keyDraft}
              onChange={(e) => setKeyDraft(e.target.value)}
              placeholder="sk-ant-..."
              autoComplete="off"
            />
            <Btn kind="solid" full onClick={storeKey} disabled={!keyDraft.trim()}>
              <Check size={13} /> Save key
            </Btn>
          </div>
        )}
        <p style={{ fontSize: 11, color: C.muted, marginTop: 10, lineHeight: 1.5 }}>
          Get a key at console.anthropic.com. It's stored on this device only and goes nowhere except
          Anthropic when you photograph a card. Reading one card costs well under a cent.
        </p>
      </Panel>

      <Panel title="Export">
        <div className="space-y-2">
          <Btn onClick={json} full><Download size={13} /> Download backup (.json)</Btn>
          <Btn onClick={csv} full><Download size={13} /> Download spreadsheet (.csv)</Btn>
        </div>
        <p style={{ fontSize: T.small, color: C.muted, marginTop: 9, lineHeight: 1.5 }}>
          The CSV opens straight in Excel or Google Sheets with every field as a column.
        </p>
      </Panel>

      <Panel title="Import">
        <input ref={fileRef} type="file" accept=".json,application/json" onChange={read} className="hidden" />
        <Btn onClick={() => fileRef.current?.click()} full><Upload size={13} /> Load a backup</Btn>
        <p style={{ fontSize: T.small, color: C.muted, marginTop: 9, lineHeight: 1.5 }}>
          Adds the cards in the file to what you already have.
        </p>
      </Panel>

      <Panel title="Start over">
        <Btn kind="danger" full onClick={onWipe}><Trash2 size={13} /> Delete every card</Btn>
        <p style={{ fontSize: T.small, color: C.muted, marginTop: 9, lineHeight: 1.5 }}>
          This can't be undone. Export a backup first.
        </p>
      </Panel>
    </div>
  );
}

    (async () => {
      const m = await loadMeta();
      if (m?.cards) { setCards(m.cards); setSnapshots(m.snapshots || []); setCollections(m.collections || []); }
      setLoading(false);
      ready.current = true;
    })();
  }, []);

  /* save (debounced) */
  useEffect(() => {
    if (!ready.current) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => { saveMeta({ cards, snapshots, collections }); }, 500);
  }, [cards, snapshots, collections]);

  /* daily snapshot */
  useEffect(() => {
    if (loading || !cards.length) return;
    const today = todayISO();
    const total = cards
      .filter((c) => c.status !== "sold")
      .reduce((s, c) => s + num(c.value) * Math.max(1, num(c.qty) || 1), 0);
    setSnapshots((prev) => {
      const last = prev[prev.length - 1];
      if (last?.d === today) {
        if (Math.abs(last.v - total) < 0.01) return prev;
        return [...prev.slice(0, -1), { d: today, v: total }];
      }
      return [...prev, { d: today, v: total }].slice(-400);
    });
  }, [cards, loading]);

  const upsert = useCallback(async (card, fullImg) => {
    if (fullImg) { try { await storage.set(imgKey(card.id), fullImg); } catch {} }
    setCards((prev) => {
      const i = prev.findIndex((c) => c.id === card.id);
      const stamped = { ...card };
      const prior = i >= 0 ? prev[i] : null;
      const v = num(card.value);
      if (v && (!prior || num(prior.value) !== v)) {
        stamped.valueUpdatedAt = todayISO();
        stamped.history = [...(card.history || []).filter((h) => h.d !== todayISO()), { d: todayISO(), v }];
      }
      return i >= 0 ? prev.map((c, j) => (j === i ? stamped : c)) : [stamped, ...prev];
    });
    setEditing(null); setAdding(false); setDetail(null);
  }, []);

  const remove = useCallback(async (id) => {
    try { await storage.delete(imgKey(id)); } catch {}
    setCards((prev) => prev.filter((c) => c.id !== id));
    setEditing(null); setDetail(null);
  }, []);

  const setValue = useCallback((id, v) => {
    setCards((prev) =>
      prev.map((c) =>
        c.id !== id ? c : {
          ...c, value: String(v), valueUpdatedAt: todayISO(),
          history: [...(c.history || []).filter((h) => h.d !== todayISO()), { d: todayISO(), v }],
        }
      )
    );
    setDetail((d) => (d && d.id === id ? { ...d, value: String(v), valueUpdatedAt: todayISO() } : d));
  }, []);

  const wipe = async () => {
    for (const c of cards) { if (c.hasImage) { try { await storage.delete(imgKey(c.id)); } catch {} } }
    setCards([]); setSnapshots([]); setConfirmWipe(false);
  };

  const sportsPresent = useMemo(() => {
    const m = {};
    cards.forEach((c) => { m[c.sport] = (m[c.sport] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }, [cards]);

  // Rarity chips follow the collection: sports variants for sports, TCG finishes for TCG.
  const typeChips = useMemo(() => {
    const pool = cards.filter((c) => sport === "all" || c.sport === sport);
    const m = {};
    pool.forEach((c) => { if (c.variant) m[c.variant] = (m[c.variant] || 0) + 1; });
    const rest = Object.entries(m)
      .filter(([v]) => v !== "Base")
      .sort((a, b) => b[1] - a[1])
      .map(([v, n]) => ({ k: v, label: v, n }));
    const out = [{ k: "all", label: "All" }];
    if (rest.length) out.push({ k: "hits", label: "Non-base" });
    out.push(...rest);
    if (pool.some((c) => c.rookie || c.firstEd)) out.push({ k: "rookie", label: "Rookie / 1st Ed" });
    if (m["Base"]) out.push({ k: "Base", label: "Base", n: m["Base"] });
    return out;
  }, [cards, sport]);

  // Thumbnails are just placeholders; swap in the full image as it loads.
  const [imgCache, setImgCache] = useState({});
  useEffect(() => {
    let stop = false;
    (async () => {
      for (const c of cards) {
        if (stop) return;
        if (!c.hasImage || imgCache[c.id]) continue;
        const v = await loadImg(c.id);
        if (stop) return;
        if (v) setImgCache((prev) => ({ ...prev, [c.id]: v }));
      }
    })();
    return () => { stop = true; };
  }, [cards.length]);

  const graderCounts = useMemo(() => {
    const m = {};
    cards.forEach((c) => { if (c.graded) m[c.gradeCompany] = (m[c.gradeCompany] || 0) + 1; });
    return m;
  }, [cards]);

  // Grades present in the collection, following whichever company is selected.
  const gradeCounts = useMemo(() => {
    const m = {};
    cards.forEach((c) => {
      if (!c.graded || !c.grade) return;
      if (grader !== "all" && c.gradeCompany !== grader) return;
      m[c.grade] = (m[c.grade] || 0) + 1;
    });
    const order = GRADE_SCALES[grader] || GRADE_SCALES.Other;
    return Object.entries(m).sort((a, b) => {
      const ai = order.indexOf(a[0]), bi = order.indexOf(b[0]);
      if (ai !== -1 && bi !== -1) return ai - bi;
      return (parseFloat(b[0]) || 0) - (parseFloat(a[0]) || 0);
    });
  }, [cards, grader]);

  const visible = useMemo(() => {
    const q = search.trim().toLowerCase();
    let out = cards.filter((c) => {
      if (showSold ? c.status !== "sold" : c.status === "sold") return false;
      if (sport !== "all" && c.sport !== sport) return false;
      if (grade === "graded" && !c.graded) return false;
      if (grade === "raw" && c.graded) return false;
      if (coll === "none" && c.collectionId) return false;
      if (coll !== "all" && coll !== "none" && c.collectionId !== coll) return false;
      if (grade === "graded" && grader !== "all" && c.gradeCompany !== grader) return false;
      if (grade === "graded" && gradeVal !== "all" && c.grade !== gradeVal) return false;
      if (type !== "all") {
        if (type === "hits" && c.variant === "Base") return false;
        else if (type === "auto" && !["Autograph", "Auto + Relic"].includes(c.variant)) return false;
        else if (type === "rookie" && !c.rookie && !c.firstEd) return false;
        else if (type === "Numbered" && !isNumbered(c)) return false;
        else if (!["hits", "auto", "rookie", "Numbered"].includes(type) && c.variant !== type) return false;
      }
      if (q) {
        const hay = [c.player, c.setName, c.year, c.cardNumber, c.parallelName, c.notes, c.sport, c.variant]
          .join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const v = (c) => num(c.value);
    out.sort((a, b) => {
      switch (sort) {
        case "value-asc": return v(a) - v(b);
        case "player": return (a.player || "").localeCompare(b.player || "");
        case "year": return (b.year || "").localeCompare(a.year || "");
        case "newest": return (b.createdAt || "").localeCompare(a.createdAt || "");
        default: return v(b) - v(a);
      }
    });
    return out;
  }, [cards, sport, type, grade, grader, gradeVal, sort, search, showSold, coll]);

  const headline = useMemo(() => {
    const owned = cards.filter((c) => c.status !== "sold");
    const total = owned.reduce((s, c) => s + num(c.value) * Math.max(1, num(c.qty) || 1), 0);
    const shown = visible.reduce((s, c) => s + num(c.value) * Math.max(1, num(c.qty) || 1), 0);
    return { total, shown, count: owned.length };
  }, [cards, visible]);

  if (loading) {
    return (
      <div className="flex min-h-screen items-center justify-center" style={{ background: C.ink }}>
        <Micro>Opening the case…</Micro>
      </div>
    );
  }

  const activeFilters =
    (sport !== "all" ? 1 : 0) + (type !== "all" ? 1 : 0) + (grade !== "all" ? 1 : 0) +
    (grader !== "all" ? 1 : 0) + (gradeVal !== "all" ? 1 : 0) + (showSold ? 1 : 0) +
    (coll !== "all" ? 1 : 0);
  const filtered = activeFilters > 0 || !!search.trim();

  const clearFilters = () => {
    setSport("all"); setType("all"); setGrade("all"); setGrader("all");
    setGradeVal("all"); setShowSold(false); setSearch(""); setColl("all");
  };

  return (
    <div className="min-h-screen pb-24" style={{ background: C.ink, color: C.text, fontFamily: SANS }}>
      <style>{`
        .cv-holo{background:linear-gradient(90deg,#4D9EFF,#7FD8E8,#A88BE8,#4D9EFF);background-size:300% 100%;animation:cvsheen 6s linear infinite}
        @media (prefers-reduced-motion: reduce){.cv-holo{animation:none}}
        @keyframes cvsheen{0%{background-position:0% 0}100%{background-position:300% 0}}
        input::placeholder,textarea::placeholder{color:${C.muted};opacity:.65}
        input:focus,textarea:focus,select:focus{border-color:${C.brass}!important}
        button:focus-visible,a:focus-visible{outline:2px solid ${C.brass};outline-offset:2px}
        select option{background:${C.case};color:${C.text}}
      `}</style>

      {/* ledger bar */}
      <div className="sticky top-0 z-30" style={{ background: C.case, borderBottom: `1px solid ${C.rule}` }}>
        <div className="flex items-center gap-3 px-4 pb-3 pt-3.5">
          {searching ? (
            <div className="flex flex-1 items-center gap-2">
              <In autoFocus value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Player, set, number…" />
              <button onClick={() => { setSearch(""); setSearching(false); }} style={{ color: C.muted, padding: 6 }}>
                <X size={18} />
              </button>
            </div>
          ) : (
            <>
              <div className="min-w-0 flex-1">
                <Micro>{filtered ? "Showing" : "Collection value"}</Micro>
                <div className="mt-1 flex items-baseline gap-2">
                  <Mono style={{ fontSize: T.display, fontWeight: 800, color: C.brass, lineHeight: 1 }}>
                    {money(filtered ? headline.shown : headline.total)}
                  </Mono>
                  <Mono style={{ fontSize: T.small, color: C.muted }}>
                    {visible.length} {visible.length === 1 ? "card" : "cards"}
                  </Mono>
                </div>
              </div>
              <button
                onClick={() => setSearching(true)}
                className="flex items-center justify-center rounded-lg"
                style={{ width: CTRL, height: CTRL, border: `1px solid ${C.rule}`, color: C.text }}
              >
                <Search size={17} />
              </button>
              <button
                onClick={() => setAdding(true)}
                className="flex items-center justify-center rounded-lg"
                style={{ width: CTRL, height: CTRL, background: C.brass, color: C.ink }}
              >
                <Plus size={17} />
              </button>
            </>
          )}
        </div>

        {tab === "collection" && !searching && (
          <div className="flex items-center gap-2 px-4 pb-3">
            <button
              onClick={() => setFilterOpen(true)}
              className="flex items-center gap-2 rounded-full px-3.5 uppercase"
              style={{
                height: 32, fontSize: T.micro, letterSpacing: "0.1em", fontWeight: 700,
                border: `1px solid ${activeFilters ? C.brass : C.rule}`,
                background: activeFilters ? C.brass : "transparent",
                color: activeFilters ? C.ink : C.muted,
              }}
            >
              <Layers size={13} />
              Filters
              {activeFilters > 0 && <Mono style={{ opacity: 0.7 }}>{activeFilters}</Mono>}
            </button>

            <button
              onClick={() => setBulk(true)}
              className="flex items-center gap-2 rounded-full px-3.5 uppercase"
              style={{
                height: 32, fontSize: T.micro, letterSpacing: "0.1em", fontWeight: 700,
                border: `1px solid ${C.rule}`, color: C.muted,
              }}
            >
              <Upload size={13} />
              Import
            </button>

            {activeFilters > 0 && (
              <button
                onClick={clearFilters}
                className="ml-auto uppercase"
                style={{ fontSize: T.micro, letterSpacing: "0.1em", fontWeight: 700, color: C.brass }}
              >
                Clear
              </button>
            )}
          </div>
        )}
      </div>

      {/* body */}
      {tab === "collection" && (
        cards.length === 0 ? (
          <Empty
            icon={<Layers size={28} />}
            head="The case is empty"
            body="Add your first card with a photo, or type in the player, set and number."
            cta={<Btn kind="solid" onClick={() => setAdding(true)}><Plus size={14} /> Add a card</Btn>}
          />
        ) : visible.length === 0 ? (
          <Empty
            icon={<Search size={26} />}
            head="No cards match"
            body="Clear a filter or two and they'll come back."
            cta={<Btn onClick={clearFilters}>Clear filters</Btn>}
          />
        ) : (
          <div className="grid grid-cols-2 gap-3 p-4 sm:grid-cols-3 lg:grid-cols-4">
            {visible.map((c) => (
              <SlabTile key={c.id} card={c} img={imgCache[c.id] || c.thumb} onOpen={() => setDetail(c)} />
            ))}
          </div>
        )
      )}
      {tab === "values" && <ValuesView cards={cards} onSetValue={setValue} />}
      {tab === "stats" && (
        <StatsView
          cards={cards}
          snapshots={snapshots}
          collections={collections}
          onManage={() => setManageCols(true)}
          onPick={(id) => { setColl(id || "none"); setTab("collection"); }}
        />
      )}
      {tab === "data" && (
        <DataView
          cards={cards}
          snapshots={snapshots}
          onImport={(cs, ss) => {
            const ids = new Set(cards.map((c) => c.id));
            setCards([...cards, ...cs.map((c) => (ids.has(c.id) ? { ...c, id: uid() } : c))]);
            if (ss.length && !snapshots.length) setSnapshots(ss);
          }}
          onWipe={() => setConfirmWipe(true)}
        />
      )}

      {/* nav */}
      <div
        className="fixed bottom-0 left-0 right-0 z-30 grid grid-cols-4"
        style={{ background: C.case, borderTop: `1px solid ${C.rule}` }}
      >
        {[
          { k: "collection", label: "Cards", icon: <Layers size={17} /> },
          { k: "values", label: "Values", icon: <DollarSign size={17} /> },
          { k: "stats", label: "Money", icon: <BarChart3 size={17} /> },
          { k: "data", label: "Data", icon: <Database size={17} /> },
        ].map((t) => (
          <button
            key={t.k}
            onClick={() => setTab(t.k)}
            className="flex flex-col items-center gap-1.5 py-3"
            style={{ color: tab === t.k ? C.brass : C.muted }}
          >
            {t.icon}
            <span className="uppercase" style={{ fontSize: 9, letterSpacing: "0.1em", fontWeight: 700 }}>{t.label}</span>
          </button>
        ))}
      </div>

      {/* overlays */}
      {filterOpen && (
        <FilterSheet
          onClose={() => setFilterOpen(false)}
          sports={sportsPresent}
          typeChips={typeChips}
          graderCounts={Object.entries(graderCounts)}
          gradeCounts={gradeCounts}
          sport={sport} setSport={setSport}
          type={type} setType={setType}
          grade={grade} setGrade={setGrade}
          grader={grader} setGrader={setGrader}
          gradeVal={gradeVal} setGradeVal={setGradeVal}
          showSold={showSold} setShowSold={setShowSold}
          sort={sort} setSort={setSort}
          onClear={clearFilters}
          resultCount={visible.length}
          collections={collections}
          coll={coll} setColl={setColl}
        />
      )}
      {manageCols && (
        <CollectionsSheet
          collections={collections}
          cards={cards}
          onClose={() => setManageCols(false)}
          onSave={(col) =>
            setCollections((prev) =>
              prev.some((c) => c.id === col.id) ? prev.map((c) => (c.id === col.id ? col : c)) : [...prev, col]
            )
          }
          onDelete={(id) => {
            setCollections((prev) => prev.filter((c) => c.id !== id));
            setCards((prev) => prev.map((c) => (c.collectionId === id ? { ...c, collectionId: "" } : c)));
            if (coll === id) setColl("all");
          }}
        />
      )}
      {bulk && (
        <BulkImport
          onClose={() => setBulk(false)}
          onSaveAll={async (batch) => {
            for (const b of batch) {
              const card = { ...b.draft, thumb: b.thumb };
              try { await storage.set(imgKey(card.id), b.full); } catch {}
              setCards((prev) => [card, ...prev]);
            }
            setBulk(false);
          }}
        />
      )}
      {adding && <CardForm onSave={upsert} onClose={() => setAdding(false)} onDelete={remove} collections={collections} />}
      {editing && <CardForm initial={editing} onSave={upsert} onClose={() => setEditing(null)} onDelete={remove} collections={collections} />}
      {detail && !editing && (
        <CardDetail
          card={cards.find((c) => c.id === detail.id) || detail}
          onClose={() => setDetail(null)}
          onEdit={() => setEditing(cards.find((c) => c.id === detail.id) || detail)}
          onSetValue={setValue}
          collections={collections}
        />
      )}
      {confirmWipe && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{ background: "rgba(15,19,23,0.9)" }}>
          <div className="w-full max-w-xs p-4" style={{ background: C.case, border: `1px solid ${C.loss}`, borderRadius: 10 }}>
            <div className="uppercase" style={{ fontSize: 12, letterSpacing: "0.1em", fontWeight: 700 }}>Delete every card?</div>
            <p style={{ fontSize: T.small, color: C.muted, margin: "8px 0 14px", lineHeight: 1.5 }}>
              All {cards.length} cards and their photos go away for good.
            </p>
            <div className="flex gap-2">
              <Btn full onClick={() => setConfirmWipe(false)}>Keep them</Btn>
              <Btn kind="danger" full onClick={wipe}>Delete all</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
